[project]
name = "withui"
version = "0.1.0"
description = "Local backend for the withUI pages"
readme = "README.md"
authors = [
    { name = "H S G", email = "hsg_001@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "dronekit>=2.9.2",
    "fastapi>=0.162.0",
    "future>=1.0.0",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pymavlink>=2.4.50",
    "pyserial>=3.5",
    "python-socketio>=5.17.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
